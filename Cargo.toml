[workspace]
members = ["crates/tsuki-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Dépendances compilées sans informations de débogage : `target/` beaucoup plus léger.
[profile.dev.package."*"]
debug = false
