<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Tsuki : le chaton tigré de la photo, seul, sur fond transparent. -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a39d96"/>
      <stop offset="0.55" stop-color="#857f78"/>
      <stop offset="1" stop-color="#6a645e"/>
    </linearGradient>
    <radialGradient id="muzzle" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f4f1ec"/>
      <stop offset="1" stop-color="#d6d0c8"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#eef7a0"/>
      <stop offset="1" stop-color="#a9c447"/>
    </radialGradient>
    <clipPath id="head">
      <path id="headShape" d="M170 600
        C 150 470 140 300 168 120
        C 250 170 330 245 392 318
        Q 512 286 632 318
        C 694 245 774 170 856 120
        C 884 300 874 470 854 600
        C 836 830 690 940 512 940
        C 334 940 188 830 170 600 Z"/>
    </clipPath>
  </defs>

  <!-- contour sombre : lisible sur fond clair comme sur fond sombre -->
  <use href="#headShape" fill="none" stroke="#1d1a1f" stroke-width="36" stroke-linejoin="round"/>

  <g clip-path="url(#head)">
    <use href="#headShape" fill="url(#fur)"/>
    <!-- intérieur des oreilles -->
    <path fill="#d9a3a8" d="M212 210 C 262 248 310 296 350 344 L 236 420 C 220 350 212 280 212 210 Z"/>
    <path fill="#d9a3a8" d="M812 210 C 762 248 714 296 674 344 L 788 420 C 804 350 812 280 812 210 Z"/>
    <!-- rayures tigrées : le « M » du front, les tempes, les joues -->
    <g fill="none" stroke="#3a3530" stroke-linecap="round" stroke-width="26">
      <path d="M512 330 L512 470"/>
      <path d="M448 340 Q458 400 474 452"/>
      <path d="M576 340 Q566 400 550 452"/>
      <path d="M392 352 Q396 392 412 428"/>
      <path d="M632 352 Q628 392 612 428"/>
      <path d="M180 560 Q236 568 282 596"/>
      <path d="M184 640 Q238 640 284 660"/>
      <path d="M844 560 Q788 568 742 596"/>
      <path d="M840 640 Q786 640 740 660"/>
    </g>
    <!-- museau et menton clairs -->
    <ellipse cx="512" cy="760" rx="190" ry="150" fill="url(#muzzle)"/>
    <ellipse cx="512" cy="905" rx="150" ry="80" fill="url(#muzzle)"/>
  </g>

  <!-- yeux -->
  <ellipse cx="376" cy="560" rx="78" ry="64" fill="#1d1a1f"/>
  <ellipse cx="648" cy="560" rx="78" ry="64" fill="#1d1a1f"/>
  <ellipse cx="376" cy="560" rx="66" ry="53" fill="url(#eye)"/>
  <ellipse cx="648" cy="560" rx="66" ry="53" fill="url(#eye)"/>
  <ellipse cx="376" cy="560" rx="17" ry="47" fill="#121014"/>
  <ellipse cx="648" cy="560" rx="17" ry="47" fill="#121014"/>
  <circle cx="398" cy="540" r="12" fill="#fff"/>
  <circle cx="670" cy="540" r="12" fill="#fff"/>

  <!-- nez et bouche -->
  <path fill="#e59aa9" stroke="#1d1a1f" stroke-width="8" stroke-linejoin="round" d="M474 676 L550 676 L512 716 Z"/>
  <path fill="none" stroke="#1d1a1f" stroke-width="10" stroke-linecap="round"
        d="M512 716 L512 744 M512 744 Q484 776 452 760 M512 744 Q540 776 572 760"/>
  <!-- moustaches -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <path d="M418 740 L230 714"/>
    <path d="M418 762 L236 782"/>
    <path d="M606 740 L794 714"/>
    <path d="M606 762 L788 782"/>
  </g>
</svg>
